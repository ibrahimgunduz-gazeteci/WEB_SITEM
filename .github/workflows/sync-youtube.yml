name: YouTube videolarını senkronize et

# RSS → assets/videos.json → commit
# GITHUB_TOKEN commit'i deploy-pages on.push'u tetiklemez; bu yüzden
# değişiklik + main ise reusable deploy-pages workflow_call ile yayınlanır.
# PAT gerekmez. Önkoşul: Pages Source = GitHub Actions.

on:
  schedule:
    - cron: "0 */6 * * *" # her 6 saatte; RSS gecikmesi genelde dakikalar–saatler
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: RSS senkron
        id: sync
        run: |
          set -e
          python scripts/sync_youtube.py
          if git diff --quiet -- assets/videos.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- assets/videos.json
          fi

      - name: Commit ve push
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/videos.json
          git commit -m "chore: youtube videoları güncellendi"
          git push

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
