name: Deploy GitHub Pages

# Tek yayın yolu (GitHub Actions → Pages).
# - main push (insan / PAT / App commit)
# - workflow_dispatch (manuel veya Worker tetiklemesi)
# - workflow_call (diğer iş akışlarından)
#
# GITHUB_TOKEN ile yapılan bot commit'leri on.push'u yeniden tetiklemez;
# bu yüzden sync-youtube.yml değişiklik olduğunda kendi içinde deploy eder.
# Admin Worker içerik yazdıktan sonra bu workflow'u workflow_dispatch ile çağırır.
#
# Önkoşul (bir kez, kullanıcı): Repo → Settings → Pages → Source = GitHub Actions
# Canlı DNS / CNAME bu ajan tarafından değiştirilmez; CNAME artifact'a kopyalanır.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Yayın paketini hazırla
        run: python scripts/prepare_pages_artifact.py

      - name: CNAME ve boyut doğrula
        run: |
          test -f _site/CNAME
          test -f _site/.nojekyll
          test -f _site/index.html
          grep -q 'ibrahimgunduz.com.tr' _site/CNAME
          SIZE=$(du -sm _site | cut -f1)
          echo "Artifact size: ${SIZE}MB"
          if [ "$SIZE" -gt 950 ]; then
            echo "Paket 950MB üstünde; Pages soft limit riski."
            exit 1
          fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
