# Weekly link health check — read-only, no auto-fixes, no secrets required.
# Does not deploy. Treat 403/429 as UNVERIFIED (not BROKEN).
name: Weekly link audit

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install Playwright (Chromium only)
        run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 8765 &
          sleep 2
          curl -fsS -o /dev/null http://127.0.0.1:8765/index.html

      - name: Run link audit
        run: node tests/links/run_audit.mjs http://127.0.0.1:8765

      - name: Upload LINK-AUDIT artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: link-audit-report
          path: |
            LINK-AUDIT.md
            LINK-AUDIT.json
          retention-days: 30
